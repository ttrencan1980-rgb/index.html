        timerInterval = setInterval(() => {
            secondsElapsed++;
            const minutes = Math.floor(secondsElapsed / 60);
            const seconds = secondsElapsed % 60;
            document.getElementById('timer').innerText = 
                `⏱️ ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }, 1000);
    }

    // Načítanie otázky
    function loadQuestion() {
        const qData = questions[currentQuestionIndex];
        document.getElementById('progress-text').innerText = `Otázka ${currentQuestionIndex + 1} z ${questions.length}`;
        document.getElementById('question-text').innerText = `${currentQuestionIndex + 1}. ${qData.q}`;
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        const letters = ['A', 'B', 'C'];

        qData.options.forEach((optionText, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = `${letters[index]}) ${optionText}`;
            
            // Ak už užívateľ odpovedal
            if (userAnswers[currentQuestionIndex] !== null) {
                btn.disabled = true;
                if (index === qData.correct) {
                    btn.classList.add('correct');
                }
                if (userAnswers[currentQuestionIndex] === index && index !== qData.correct) {
                    btn.classList.add('wrong');
                }
            } else {
                btn.onclick = () => selectOption(index);
            }

            optionsContainer.appendChild(btn);
        });

        // Úprava stavu tlačidiel
        document.getElementById('prev-btn').disabled = currentQuestionIndex === 0;
        
        if (currentQuestionIndex === questions.length - 1) {
            document.getElementById('next-btn').innerText = "Dokončiť test";
        } else {
            document.getElementById('next-btn').innerText = "Nasledujúca →";
        }
    }

    // Výber odpovede
    function selectOption(selectedIndex) {
        userAnswers[currentQuestionIndex] = selectedIndex;
        loadQuestion();
    }

    // Navigácia späť
    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            loadQuestion();
        }
    }

    // Navigácia ďalej / dokončenie
    function nextQuestion() {
        if (currentQuestionIndex < questions.length - 1) {
            currentQuestionIndex++;
            loadQuestion();
        } else {
            showResults();
        }
    }

    // Zobrazenie výsledkov
    function showResults() {
        clearInterval(timerInterval);
        document.getElementById('quiz-body').style.display = 'none';
        document.getElementById('results-body').style.display = 'block';

        let score = 0;
        userAnswers.forEach((ans, idx) => {
            if (ans === questions[idx].correct) {
                score++;
            }
        });

        const minutes = Math.floor(secondsElapsed / 60);
        const seconds = secondsElapsed % 60;
        const timeStr = `${minutes} min ${seconds} sec`;

        document.getElementById('score-text').innerText = `Tvoje skóre: ${score} z ${questions.length}`;
        document.getElementById('time-taken-text').innerText = `Celkový čas: ${timeStr}`;
    }

    // Reštart testu
    function restartQuiz() {
        currentQuestionIndex = 0;
        userAnswers = new Array(questions.length).fill(null);
        secondsElapsed = 0;
        document.getElementById('results-body').style.display = 'none';
        document.getElementById('quiz-body').style.display = 'block';
        startTimer();
        loadQuestion();
    }

    // Inicializácia pri načítaní
    window.onload = () => {
        startTimer();
        loadQuestion();
    };
</script>

</html>
