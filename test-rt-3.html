        "strata alebo úraz ľudského života, strata služieb pre verejnosť, strata kultúrneho dedičstva"
      ],
      correct: 2
    },
    {
      q: "Aké sú minimálne intervaly medzi revíziami LPS hladiny I a II",
      norm: "STN EN 62305-3:2012",
      options: [
        "3 roky",
        "2 roky",
        "4 roky"
      ],
      correct: 1
    }
  ];

  let currentQuestion = 0;
  let userAnswers = new Array(questions.length).fill(null);

  function loadQuestion() {
    const q = questions[currentQuestion];
    document.getElementById('progress').innerText = `Otázka ${currentQuestion + 1} z ${questions.length}`;
    document.getElementById('question-text').innerText = `${currentQuestion + 1}. ${q.q}`;
    document.getElementById('norm-text').innerText = q.norm;

    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';

    const letters = ['A)', 'B)', 'C)'];

    q.options.forEach((opt, index) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';

      if (userAnswers[currentQuestion] !== null) {
        if (index === q.correct) {
          btn.classList.add('correct');
        } else if (index === userAnswers[currentQuestion]) {
          btn.classList.add('incorrect');
        }
      }

      btn.innerHTML = `<strong>${letters[index]}</strong> <span>${opt}</span>`;
      btn.onclick = () => selectOption(index);
      optionsContainer.appendChild(btn);
    });

    document.getElementById('prev-btn').disabled = currentQuestion === 0;
    
    if (currentQuestion === questions.length - 1) {
      document.getElementById('next-btn').innerText = 'Dokončiť test';
    } else {
      document.getElementById('next-btn').innerText = 'Nasledujúca >';
    }
  }

  function selectOption(index) {
    userAnswers[currentQuestion] = index;
    loadQuestion();
  }

  function prevQuestion() {
    if (currentQuestion > 0) {
      currentQuestion--;
      loadQuestion();
    }
  }

  function nextQuestion() {
    if (currentQuestion < questions.length - 1) {
      currentQuestion++;
      loadQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    document.getElementById('quiz-body').style.display = 'none';
    document.getElementById('results-body').style.display = 'block';

    let score = 0;
    questions.forEach((q, i) => {
      if (userAnswers[i] === q.correct) score++;
    });

    const percentage = Math.round((score / questions.length) * 100);
    document.getElementById('score-text').innerHTML = `Získali ste <strong>${score}</strong> z <strong>${questions.length}</strong> bodov (${percentage}%).`;
  }

  function restartQuiz() {
    currentQuestion = 0;
    userAnswers = new Array(questions.length).fill(null);
    document.getElementById('quiz-body').style.display = 'block';
    document.getElementById('results-body').style.display = 'none';
    loadQuestion();
  }

  loadQuestion();
</script>

</body>
</html>
