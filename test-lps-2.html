      margin-right: 12px;
      min-width: 20px;
    }

    .option.correct {
      background-color: #dcfce7 !important;
      border-color: #22c55e !important;
      color: #14532d !important;
      font-weight: 600;
    }
    .option.incorrect {
      background-color: #fee2e2 !important;
      border-color: #ef4444 !important;
      color: #7f1d1d !important;
    }
    .option.disabled {
      pointer-events: none;
      opacity: 0.7;
    }
    .option.disabled.correct {
      opacity: 1;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 16px;
    }
    .btn {

      font-weight: 600;

  let currentQuestion = 0;
  let score = 0;
  let userAnswers = new Array(questions.length).fill(null);

  function renderQuestion(index) {
    const container = document.getElementById('quiz-container');
    const q = questions[index];
    const letters = ['A', 'B', 'C', 'D'];

    let optionsHTML = '';
    q.options.forEach((opt, i) => {
      let extraClass = '';
      if (userAnswers[index] !== null) {
        extraClass += ' disabled';
        if (i === q.correct) {
          extraClass += ' correct';
        } else if (i === userAnswers[index]) {
          extraClass += ' incorrect';
        }
      }

      optionsHTML += `
        <div class="option${extraClass}" onclick="selectOption(${index}, ${i})">
          <span class="option-letter">${letters[i]})</span>
          <span>${opt}</span>
        </div>
      `;
    });

    container.innerHTML = `
      <div class="card">
        <div class="question-header">
          <span class="question-number">Otázka ${index + 1} z ${questions.length}</span>
        </div>
        <div class="question-title">${q.q}</div>
        <span class="norm-tag">${q.norm}</span>
        <div class="options">
          ${optionsHTML}
        </div>
        <div class="controls">
          <button class="btn btn-secondary" onclick="prevQuestion()" ${index === 0 ? 'disabled style="opacity:0.5;cursor:default;"' : ''}>◄ Predchádzajúca</button>
          ${index === questions.length - 1 
            ? `<button class="btn btn-primary" onclick="showResults()">Vyhodnotiť test</button>`
            : `<button class="btn btn-primary" onclick="nextQuestion()">Nasledujúca ►</button>`
          }
        </div>
      </div>
    `;
  }

  function selectOption(qIndex, optionIndex) {
    if (userAnswers[qIndex] !== null) return; // Zabráni opakovanej voľbe

    userAnswers[qIndex] = optionIndex;
    if (optionIndex === questions[qIndex].correct) {
      score++;
    }
    renderQuestion(qIndex);
  }

  function nextQuestion() {
    if (currentQuestion < questions.length - 1) {
      currentQuestion++;
      renderQuestion(currentQuestion);
    }
  }

  function prevQuestion() {
    if (currentQuestion > 0) {
      currentQuestion--;
      renderQuestion(currentQuestion);
    }
  }

    document.getElementById('quiz-container').style.display = 'none';
    const resultsCard = document.getElementById('results-card');
    resultsCard.style.display = 'block';

    const percentage = Math.round((score / questions.length) * 100);
    document.getElementById('score-text').innerText = `${score} / ${questions.length} (${percentage}%)`;

    let feedback = '';
    if (percentage >= 90) {
      feedback = 'Výborne! Máte skvelé vedomosti v oblasti noriem a LPS.';
    } else if (percentage >= 75) {
      feedback = 'Dobrá práca! Väčšinu otázok ste zvládli správne.';
    } else {
      feedback = 'Odporúčame si ešte raz prejsť normy a preskúšať sa znovu.';
    }
    document.getElementById('feedback-text').innerText = feedback;
  }

  function restartQuiz() {
    currentQuestion = 0;
    score = 0;
    userAnswers.fill(null);
    document.getElementById('results-card').style.display = 'none';
    document.getElementById('quiz-container').style.display = 'block';
    renderQuestion(0);
  }

  // Spustenie testu
  renderQuestion(0);
</script>

</body>
</html>
