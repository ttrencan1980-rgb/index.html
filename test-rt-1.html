<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test RT1 - Elektrotechnické predpisy a normy</title>
  <!-- jsPDF pre generovanie PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 20px 12px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      padding: 24px;
    }

    header {
      border-bottom: 2px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
    }

    .timer-box {
      background: #eff6ff;
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.95rem;
      border: 1px solid #bfdbfe;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background-color: var(--border);
      border-radius: 4px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background-color: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .question-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 20px;
    }

    .nav-btn {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .nav-btn.answered {
      background: #dbeafe;
      border-color: var(--primary);
      color: var(--primary);
    }

    .nav-btn.active {
      outline: 2px solid var(--primary);
      outline-offset: 1px;
    }

    .question-box {
      margin-bottom: 24px;
    }

    .norm-tag {
      display: inline-block;
      background: #f1f5f9;
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .question-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option {
      display: flex;
      align-items: flex-start;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .option:hover {
      background-color: #f8fafc;
      border-color: #cbd5e1;
    }

    .option.selected {
      border-color: var(--primary);
      background-color: #eff6ff;
    }

    .option input {
      margin-top: 3px;
      margin-right: 12px;
      cursor: pointer;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 24px;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 6px;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-secondary {
      background-color: #e2e8f0;
      color: var(--text);
    }

    .btn-secondary:hover {
      background-color: #cbd5e1;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-success {
      background-color: var(--success);
      color: white;
    }

    .btn-success:hover {
      background-color: #16a34a;
    }

    /* Výsledky */
    .results-container {
      display: none;
    }

    .score-card {
      text-align: center;
      padding: 24px;
      background: #f8fafc;
      border-radius: 8px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }

    .score-val {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--primary);
    }

    .review-item {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .review-item.correct-bg {
      border-left: 4px solid var(--success);
    }

    .review-item.incorrect-bg {
      border-left: 4px solid var(--danger);
    }

    .answer-status {
      font-weight: 600;
      margin-top: 8px;
      font-size: 0.9rem;
    }

    .correct-text { color: var(--success); }
    .incorrect-text { color: var(--danger); }

    .pdf-btn {
      margin-top: 16px;
      width: 100%;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Test RT1 (40 Otázok)</h1>
    <div class="timer-box" id="timer">Čas: 00:00</div>
  </header>

  <div id="quiz-screen">
    <div class="progress-bar-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="question-nav" id="question-nav"></div>

    <div class="question-box">
      <div class="norm-tag" id="norm-tag">STN --</div>
      <div class="question-title" id="question-text">Loading...</div>
      <div class="options" id="options-container"></div>
    </div>

    <div class="controls">
      <button class="btn btn-secondary" id="prev-btn" onclick="prevQuestion()">Späť</button>
      <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()">Ďalej</button>
      <button class="btn btn-success" id="submit-btn" style="display: none;" onclick="submitQuiz()">Vyhodnotiť test</button>
    </div>
  </div>

  <div id="results-screen" class="results-container">
    <div class="score-card">
      <h2>Výsledky testu</h2>
      <div class="score-val" id="score-val">0%</div>
      <p id="score-text">0 zo 40 správne</p>
      <p id="time-spent-text" style="margin-top: 8px; color: var(--text-muted); font-size: 0.9rem;"></p>
      <button class="btn btn-primary pdf-btn" onclick="downloadPDF()">Stiahnuť PDF Protokol</button>
    </div>

    <h3>Prehľad odpovedí</h3>
    <div id="review-container" style="margin-top: 16px;"></div>
  </div>
</div>

<script>
  const questionsRT1 = [
    { q: "B príkaz sa vydáva", norm: "STN 34 3100:2001", a: "ak je nutné aj pre viac pracovných skupín ak pracujú pod jedným dozorom", b: "na jedno pracovisko a pre jednu pracovnú skupinu", c: "na jedno pracovisko ak je nutné aj pre viac pracovných skupín ak pracujú pod jedným dozorom", correct: 1 },
    { q: "B príkaz sa vydáva na dobu", norm: "STN 34 3100:2001", a: "max. 24 hod.", b: "na dobu určitú max. 48 hod.", c: "na dobu určitú max. 7 dni", correct: 0 },
    { q: "Akú základnú podmienku musí u sietí TN spĺňať impedancia slučky", norm: "STN 33 2000-4-41:2019", a: "Zs ≤ U0 x Ia", b: "Zs ≤ U0/Ia", c: "Zs ≥ U0/Ia", correct: 1 },
    { q: "Môže byť vynechané ochranné opatrenie pri poruche u skrutiek s maticami, nitov, štítkov a káblových príchytiek", norm: "STN 33 2000-4-41:2019", a: "áno ak sú vyhotovené z izolačného materiálu", b: "áno", c: "nie", correct: 1 },
    { q: "Ako musia byť prepojené vodivé časti uzatvorené v izolačnom kryte, použitého pri ochrannom opatrení dvojitou alebo zosilnenou izoláciou", norm: "STN 33 2000-4-41:2019", a: "môžu byť spojené s ochranným vodičom", b: "nesmú byť spojené s ochranným vodičom", c: "musia byť spojené s ochranným vodičom", correct: 1 },
    { q: "Ako sa dá definovať základné pravidlo ochrany pred úrazom elektrickým prúdom", norm: "STN EN 61140:2018", a: "nebezpečné živé časti nesmú byť prístupné a prístupné vodivé časti nesmú byť nebezpečnými živými časťami, buď pri normálnych podmienkach, alebo v stave s jednou poruchou", b: "nebezpečné živé časti smú byť prístupné a prístupné vodivé časti smú byť nebezpečnými živými časťami, buď pri normálnych podmienkach, alebo v stave s jednou poruchou", c: "bezpečné neživé časti nesmú byť prístupné a prístupné nevodivé časti nesmú byť nebezpečnými živými časťami", correct: 0 },
    { q: "Musí mať obvod napájajúci jednotlivé zariadenia triedy ochrany II ochranný vodič vedený ku každému bodu inštalácie a každému bodu pripojenia", norm: "STN 33 2000-4-41:2019", a: "nie", b: "nie ak zariadenia triedy ochrany II sú pripojené na obvod cez zásuvku", c: "áno", correct: 2 },
    { q: "Akým spôsobom môže byť dosiahnutá ochrana pri jednej poruche", norm: "STN EN 61140:2018", a: "ochranným prostriedkom nezávislým od základnej ochrany", b: "ochranným prostriedkom nezávislým od ochrany pred preťažením", c: "ochranným prostriedkom nezávislým od ochrany RCD", correct: 0 },
    { q: "Aké sú hranice bezpečného malého napätia krytov izolovaných od živých častí, v priestoroch zvlášť nebezpečných, ak dochádza pri obsluhe k dotyku častí zariadenia", norm: "STN 33 2000-4-41:2019", a: "30 V striedavé a 50 V jednosmerné napätie", b: "12 V striedavé a 25 V jednosmerné napätie", c: "20 V striedavé a 60 V jednosmerné napätie", correct: 1 },
    { q: "Ak sa pre ochranu pri poruche použité prúdové chrániče v sieťach TT, je nutné používať ďalšie ochranné zariadenia", norm: "STN 33 2000-4-41:2019", a: "áno", b: "nie ak U0 ≤ 120V", c: "nie", correct: 0 },
    { q: "Úbytok napätia pre svetelný odber resp. svetelný a zmiešaný odber v rozvode medzi prípojkovou skriňou a rozvádzačom za elektromerom nesmie byť väčší ako", norm: "STN 33 2130:1983", a: "3%", b: "2%", c: "4%", correct: 1 },
    { q: "Vodorovná inštalačná zóna šírky 300 mm zóna vodorovná stredná (ZV-s) je", norm: "STN 33 2130:1983", a: "od 900 mm do 1200 mm nad dokončenou dlážkou", b: "od 800 mm do 1100 mm nad dokončenou dlážkou", c: "od 1000 mm do 1300 mm nad dokončenou dlážkou", correct: 0 },
    { q: "Ako musia byť istené všetky neuzemnené vodiče obvodov miestneho osvetlenia na pracovnom stroji", norm: "STN EN 60204-1:2019", a: "zariadeniami na ochranu pred nadprúdom, oddelenými od zariadení, ktoré chránia ostatné obvody", b: "zariadeniami na ochranu pred nadprúdom, spolu so zariadeniami pre ostatné obvody", c: "zariadeniami na ochranu pred skratom, oddelenými od zariadení, ktoré chránia ostatné obvody", correct: 0 },
    { q: "Čo nie je potrebné vykonávať pri kusovej skúške rozvádzača", norm: "STN EN 61439-1:2012", a: "nevyžaduje sa preverovanie pre prístroje a samostatné časti vstavané do rozvádzača", b: "detegovanie chýb materiálov, ľudskej práce a určenie správneho fungovania rozvádzača", c: "vždy je potrebné vykonávať na všetky časti rozvádzača", correct: 0 },
    { q: "Čo má obsahovať návod pre údržbu obsiahnutý v technickej dokumentácii", norm: "STN EN 60204-1:2019", a: "postupu pre programovanie alebo konfiguráciu", b: "napr. pokyny a postupy na bežnú údržbu a frekvencia a spôsob funkčných skúšok", c: "opis inštalácie a montáž elektrického vybavenia", correct: 1 },
    { q: "Ako musia byť usporiadané snímače polohy (napr. koncové snímače, bezdotykové spínače)", norm: "STN EN 60204-1:2019", a: "tak aby sa nemohli poškodiť v prípade presahu", b: "sa používajú len v nebezpečných prípadoch", c: "na bezpečné zastavenie ich nemožno použiť", correct: 0 },
    { q: "Ktoré motory pracovných strojov musia byť istené proti preťaženiu", norm: "STN EN 60204-1:2019", a: "ktoré môžu byť preťažené a nie sú mechanicky chránené proti preťaženiu", b: "motory s menovitým výkonom nad 0,5 kW", c: "motory s menovitým výkonom nad 1 kW", correct: 0 },
    { q: "Vypínač je možné inštalovať vedľa umývacej zóny", norm: "STN 33 2000-7-701:2007", a: "vo výške 120 cm tesne vedľa zóny", b: "vo výške 120 cm min. 30 cm vedľa zóny", c: "vo výške 120 cm min. 20 cm vedľa zóny", correct: 0 },
    { q: "Zvodová sieť elektrostaticky vodivej podlahy v zdravotníckych priestoroch", norm: "STN 33 2000-7-710:2013", a: "sa musí spojiť s prípojnicou pospájania", b: "musí byť izolovaná od ostatných zariadení", c: "nesmie sa spojiť s prípojnicou pospájania", correct: 0 },
    { q: "Minimálny prierez vodičov vedenia v stánkoch z Cu je", norm: "STN 33 2000-7-704:2019", a: "0,75 mm²", b: "1,5 mm²", c: "2,5 mm²", correct: 1 },
    { q: "V poľnohospodárskych alebo záhradníckych prevádzkarňach musí mať elektrické zariadenie ak sa používa v normálnych podmienkach minimálny stupeň ochrany,", norm: "STN 33 2000-7-705:2007", a: "IP 44", b: "IP 2X", c: "IP 43", correct: 0 },
    { q: "Pri vedeniach do 1 kV vzdialenosť živej časti holého vedenia od stabilného vodivého plota je min.", norm: "STN 33 3300:1983", a: "2 m", b: "4 m", c: "3 m", correct: 0 },
    { q: "V distribučných sieťach TN je dovolený čas odpojenia vo výnimočných prípadoch nepresahujúci", norm: "STN 33 2000-4-41:2019", a: "2 s", b: "5 s", c: "30 s", correct: 2 },
    { q: "Pri prípojkách do 1 kV vzdialenosť závesného kábla od stabilného vodivého plota je min.", norm: "STN 33 3300:1983", a: "3 m", b: "1 m", c: "2 m", correct: 1 },
    { q: "Každý PV reťazec (string) je potrebné chrániť istiacim prístrojom ak", norm: "STN 33 2000-7-712:2022", a: "každý PV reťazec je potrebné chrániť istiacim prístrojom bez ohľadu na počet PV reťazcov pripojených k striedaču", b: "počet PV reťazcov pripojených k striedaču je väčší ako 2", c: "počet PV reťazcov pripojených k striedaču je väčší alebo rovný 2", correct: 1 },
    { q: "Čo je to prípustné riziko (RT) určované vo výpočtoch", norm: "STN EN 62305-1:2012", a: "Hodnota rizika ktorá sa môže pripustiť pri chránenej stavbe", b: "Maximálna hodnota rizika ktorá sa môže pripustiť pri chránenej stavbe", c: "Minimálna hodnota rizika ktorá sa môže pripustiť pri chránenej stavbe", correct: 1 },
    { q: "U stavieb zo železobetónu musí byť elektrické prepojenie armovanie stanovené skúškou medzi najvyšším dielom a úrovňou zemi. Aká má byť hodnota elektrického odporu, aby mohlo byť použité oceľové armovanie ako náhodný zvod", norm: "STN EN 62305-3:2012", a: "max 0,5 Ω", b: "max 0,2 Ω", c: "max 0,1 Ω", correct: 1 },
    { q: "Aké časti môže obsahovať zachytávacia sústava", norm: "STN EN 62305-3:2012", a: "komíny, antény", b: "betónový skelet budovy", c: "zachytávacie tyče, závesné lana, mriežová sieť vodičov", correct: 2 },
    { q: "Aký má byť uhol medzi susednými lúčmi v prípade, že sa páskové alebo drôtové zemniče ukladajú lúčovite", norm: "STN 33 2000-5-54:2012", a: "80°", b: "60°", c: "50°", correct: 1 },
    { q: "Čo predstavuje skratka LPS v zmysle STN EN 62305", norm: "STN EN 62305-3:2012", a: "Úroveň ochrany pred bleskom", b: "Zóna ochrany pred bleskom", c: "systém používaný na zníženie hmotnej škody spôsobenej zásahom blesku do stavby", correct: 2 },
    { q: "Pravidelná revízia elektrických spotrebičov okrem spotrebičov držaných v ruke zaradených do skupiny D podľa oblasti ich používania sa vykonáva", norm: "STN 33 1630:2025", a: "1 x za 6 mesiacov", b: "1 x za 12 mesiacov", c: "1 x za 24 mesiacov", correct: 1 },
    { q: "Skúšobné napätie el. inštalácie s menovitým napätím PELV je", norm: "STN 33 2000-6:2018", a: "500 V DC", b: "250 V DC", c: "250 V AC", correct: 1 },
    { q: "Pravidelná revízia elektrických spotrebičov okrem spotrebičov držaných v ruke zaradených do skupiny C podľa oblasti ich používania sa vykonáva", norm: "STN 33 1630:2025", a: "1 x za 12 mesiacov", b: "1 x za 6 mesiacov", c: "1 x za 24 mesiacov", correct: 0 },
    { q: "Hodnota izolačného odporu spotrebiča s triedou ochrany I držaných počas prevádzky v ruke musí byť minimálne", norm: "STN EN 50699:2022", a: "1 MΩ", b: "2 MΩ", c: "1,5 MΩ", correct: 1 },
    { q: "Minimálny požadovaný izolačný odpor el. inštalácie s napätím FELV je", norm: "STN 33 2000-6:2018", a: "≥ 1 MΩ", b: "≥ 0,5 MΩ", c: "≥ 1,5 MΩ", correct: 0 },
    { q: "Overenie účinnosti opatrení na ochranu samočinným odpojením napájania pri sieťach TT", norm: "STN 33 2000-6:2018", a: "sa musí overiť meraním odporu uzemňovača neživých častí el. inštalácie", b: "sa musí overiť meraním impedancie poruchovej slučky", c: "sa musí overiť meraním menovitého napätia", correct: 0 },
    { q: "Odpor ochranného pospájania pre skúšané zariadenie s dĺžkou káblov 10 m", norm: "STN EN 50699:2022", a: "nesmie presiahnuť 0,4 Ω", b: "nesmie presiahnuť 0,3 Ω", c: "môže byť väčší ako 0,4 Ω", correct: 2 },
    { q: "Izolačný odpor náradia so zosilnenou izoláciou nesmie byť menší ako", norm: "STN EN 50699:2022", a: "menší ako 5 MΩ", b: "menší ako 7 MΩ", c: "menší ako 2 MΩ", correct: 2 },
    { q: "Aké sú minimálne intervaly medzi revíziami LPS hladiny I a II", norm: "STN EN 62305-3:2012", a: "4 roky", b: "2 roky", c: "3 roky", correct: 1 },
    { q: "Na základe akých údajov sa rozhoduje o ochrane stavby alebo inžinierskych sietí pred bleskom, rovnako ako o výberu ochranných opatrení", norm: "STN EN 62305-1:2012", a: "strata alebo úraz ľudského života, strata služieb pre verejnosť, strata kultúrneho dedičstva", b: "hodnoty investície", c: "vzdialenosť objektu od okolitých stavieb", correct: 0 }
  ];

  let currentIndex = 0;
  let userAnswers = new Array(questionsRT1.length).fill(null);
  let secondsElapsed = 0;
  let timerInterval = null;

  function startTimer() {
    timerInterval = setInterval(() => {
      secondsElapsed++;
      const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
      const secs = (secondsElapsed % 60).toString().padStart(2, '0');
      document.getElementById('timer').innerText = `Čas: ${mins}:${secs}`;
    }, 1000);
  }

  function renderNav() {
    const navContainer = document.getElementById('question-nav');
    navContainer.innerHTML = '';
    questionsRT1.forEach((_, idx) => {
      const btn = document.createElement('button');
      btn.className = 'nav-btn';
      if (userAnswers[idx] !== null) btn.classList.add('answered');
      if (idx === currentIndex) btn.classList.add('active');
      btn.innerText = idx + 1;
      btn.onclick = () => goToQuestion(idx);
      navContainer.appendChild(btn);
    });
  }

  function loadQuestion() {
    const q = questionsRT1[currentIndex];
    document.getElementById('norm-tag').innerText = q.norm;
    document.getElementById('question-text').innerText = `${currentIndex + 1}. ${q.q}`;

    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';

    const options = [
      { text: q.a, val: 0, label: 'A' },
      { text: q.b, val: 1, label: 'B' },
      { text: q.c, val: 2, label: 'C' }
    ];

    options.forEach(opt => {
      const div = document.createElement('div');
      div.className = 'option' + (userAnswers[currentIndex] === opt.val ? ' selected' : '');
      div.onclick = () => selectOption(opt.val);

      div.innerHTML = `
        <input type="radio" name="q_opt" ${userAnswers[currentIndex] === opt.val ? 'checked' : ''}>
        <div><strong>${opt.label}:</strong> ${opt.text}</div>
      `;
      optionsContainer.appendChild(div);
    });

    document.getElementById('prev-btn').style.visibility = currentIndex === 0 ? 'hidden' : 'visible';
    if (currentIndex === questionsRT1.length - 1) {
      document.getElementById('next-btn').style.display = 'none';
      document.getElementById('submit-btn').style.display = 'block';
    } else {
      document.getElementById('next-btn').style.display = 'block';
      document.getElementById('submit-btn').style.display = 'none';
    }

    const progress = ((currentIndex + 1) / questionsRT1.length) * 100;
    document.getElementById('progress-bar').style.width = `${progress}%`;

    renderNav();
  }

  function selectOption(val) {
    userAnswers[currentIndex] = val;
    loadQuestion();
  }

  function nextQuestion() {
    if (currentIndex < questionsRT1.length - 1) {
      currentIndex++;
      loadQuestion();
    }
  }

  function prevQuestion() {
    if (currentIndex > 0) {
      currentIndex--;
      loadQuestion();
    }
  }

  function goToQuestion(idx) {
    currentIndex = idx;
    loadQuestion();
  }

  function submitQuiz() {
    clearInterval(timerInterval);
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('results-screen').style.display = 'block';

    let score = 0;
    const reviewContainer = document.getElementById('review-container');
    reviewContainer.innerHTML = '';

    questionsRT1.forEach((q, idx) => {
      const uAns = userAnswers[idx];
      const isCorrect = uAns === q.correct;
      if (isCorrect) score++;

      const optsText = [q.a, q.b, q.c];
      const userText = uAns !== null ? `${['A','B','C'][uAns]}: ${optsText[uAns]}` : "Nezodpovedané";
      const correctText = `${['A','B','C'][q.correct]}: ${optsText[q.correct]}`;

      const item = document.createElement('div');
      item.className = `review-item ${isCorrect ? 'correct-bg' : 'incorrect-bg'}`;
      item.innerHTML = `
        <div class="norm-tag">${q.norm}</div>
        <div style="font-weight:600;">${idx + 1}. ${q.q}</div>
        <div class="answer-status ${isCorrect ? 'correct-text' : 'incorrect-text'}">
          Tvoja odpoveď: ${userText}
        </div>
        ${!isCorrect ? `<div class="answer-status correct-text">Správna odpoveď: ${correctText}</div>` : ''}
      `;
      reviewContainer.appendChild(item);
    });

    const percent = Math.round((score / questionsRT1.length) * 100);
    document.getElementById('score-val').innerText = `${percent}%`;
    document.getElementById('score-text').innerText = `${score} zo ${questionsRT1.length} správne`;
    
    const mins = Math.floor(secondsElapsed / 60);
    const secs = secondsElapsed % 60;
    document.getElementById('time-spent-text').innerText = `Celkový čas: ${mins} min ${secs} s`;
  }

  function downloadPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.setFont("Helvetica", "bold");
    doc.setFontSize(16);
    doc.text("Protokol z testu RT1", 14, 20);

    doc.setFontSize(10);
    doc.setFont("Helvetica", "normal");
    
    const mins = Math.floor(secondsElapsed / 60);
    const secs = secondsElapsed % 60;
    let score = 0;
    userAnswers.forEach((ans, i) => { if (ans === questionsRT1[i].correct) score++; });
    const percent = Math.round((score / questionsRT1.length) * 100);

    doc.text(`Vyhodnotenie: ${score} / ${questionsRT1.length} (${percent}%)`, 14, 28);
    doc.text(`Cas riesenia: ${mins} min ${secs} s`, 14, 34);

    let y = 44;
    questionsRT1.forEach((q, idx) => {
      if (y > 270) {
        doc.addPage();
        y = 20;
      }
      const uAns = userAnswers[idx];
      const isCorrect = uAns === q.correct;
      const optsText = [q.a, q.b, q.c];
      const statusText = isCorrect ? "SPRAVNE" : `NESPRAVNE (Spravne: ${['A','B','C'][q.correct]})`;

      doc.setFont("Helvetica", "bold");
      doc.text(`${idx + 1}. [${q.norm}]`, 14, y);
      y += 5;

      doc.setFont("Helvetica", "normal");
      const splitQ = doc.splitTextToSize(q.q, 180);
      doc.text(splitQ, 14, y);
      y += (splitQ.length * 4) + 1;

      doc.text(`Vasa odpoved: ${uAns !== null ? ['A','B','C'][uAns] : 'Nezodpovedane'} - Status: ${statusText}`, 14, y);
      y += 8;
    });

    doc.save("Vysledok_Test_RT1.pdf");
  }

  // Inicializácia
  window.onload = () => {
    loadQuestion();
    startTimer();
  };
</script>
</body>
</html>
