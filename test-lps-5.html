        norm: "STN EN 62305-3:2012",
        question: "Ako sa označuje priestor, v ktorom je prítomná výbušná plynná atmosféra tvorená zmesou horľavých látok plynu, par alebo hmly so vzduchom prítomná trvale alebo pre dlhé časové obdobia",
        options: ["zóna 0", "zóna 2", "zóna 20"],
        correct: 0
    },
    {
        norm: "STN EN 62305-3:2012",
        question: "V akej vzdialenosti má byť umiestnení vonkajší LPS (zberacia sústava a zvody ) od nebezpečných výbušných priestorov",
        options: ["1 m", "1,5 m", "2 m"],
        correct: 0
    },
    {
        norm: "STN EN 62305-3:2012",
        question: "Ako sa označuje priestor, v ktorom je výbušná atmosféra tvorená oblakom zvíreného horľavého prachu vo vzduchu prítomná trvalo alebo pre dlhú dobu alebo často",
        options: ["zóna 21", "zóna 20", "zóna 0"],
        correct: 1
    },
    {
        norm: "STN EN 62305-3:2012",
        question: "Ako sa označuje priestor, v ktorom nie je vznik výbušnej plynnej atmosféry tvorenej zmesou horľavých látok vo forme plynu, pár alebo hmly so vzduchom za normálnej prevádzky pravdepodobný, pokiaľ táto atmosféra vznikne, bude pretrvávať len krátke časové obdobie",
        options: ["zóna 2", "zóna 1", "zóna 21"],
        correct: 0
    }
];

let currentIndex = 0;
let userAnswers = new Array(questions.length).fill(null);
let timerInterval = null;
let secondsElapsed = 0;

function startTimer() {
    clearInterval(timerInterval);
    secondsElapsed = 0;
    timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timer').textContent = `${mins}:${secs}`;
    }, 1000);
}

function loadQuestion(index) {
    const q = questions[index];
    document.getElementById('norm-text').textContent = q.norm;
    document.getElementById('question-text').textContent = q.question;
    document.getElementById('progress-text').textContent = `${index + 1} / ${questions.length}`;

    const container = document.getElementById('options-container');
    container.innerHTML = '';

    const letters = ['A', 'B', 'C', 'D'];
    const isAnswered = userAnswers[index] !== null;

    q.options.forEach((optText, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';

        if (isAnswered) {
            btn.classList.add('disabled');
            if (i === q.correct) {
                btn.classList.add('correct');
            } else if (i === userAnswers[index]) {
                btn.classList.add('incorrect');
            }
        }

        btn.onclick = () => selectOption(i);
        btn.innerHTML = `
            <span class="option-letter">${letters[i]})</span>
            <span>${optText}</span>
        `;
        container.appendChild(btn);
    });

    document.getElementById('prev-btn').disabled = index === 0;

    if (index === questions.length - 1) {
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('finish-btn').classList.remove('hidden');
    } else {
        document.getElementById('next-btn').classList.remove('hidden');
        document.getElementById('finish-btn').classList.add('hidden');
    }
}

function selectOption(optionIndex) {
    if (userAnswers[currentIndex] !== null) return; // Zamedzí zmene po odpovedi
    userAnswers[currentIndex] = optionIndex;
    loadQuestion(currentIndex);
}

function prevQuestion() {
    if (currentIndex > 0) {
        currentIndex--;
        loadQuestion(currentIndex);
    }
}

function nextQuestion() {
    if (currentIndex < questions.length - 1) {
        currentIndex++;
        loadQuestion(currentIndex);
    }
}

function showResults() {
    clearInterval(timerInterval);
    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('results-screen').classList.remove('hidden');

    let score = 0;
    const reviewList = document.getElementById('review-list');
    reviewList.innerHTML = '';

    const letters = ['A', 'B', 'C', 'D'];

    questions.forEach((q, i) => {
        const uAns = userAnswers[i];
        const isCorrect = uAns === q.correct;
        if (isCorrect) score++;

        const item = document.createElement('div');
        item.className = `review-item ${isCorrect ? 'is-correct' : 'is-incorrect'}`;

        let userAnsText = uAns !== null ? `${letters[uAns]}) ${q.options[uAns]}` : "Nezodpovedané";
        let correctAnsText = `${letters[q.correct]}) ${q.options[q.correct]}`;

        item.innerHTML = `
            <div class="review-q-num">Otázka ${i + 1} (${q.norm})</div>
            <div class="review-q-text">${q.question}</div>
            <div class="review-ans">Vaša odpoveď: <span class="${isCorrect ? 'txt-correct' : 'txt-incorrect'}">${userAnsText}</span></div>
            ${!isCorrect ? `<div class="review-ans">Správna odpoveď: <span class="txt-correct">${correctAnsText}</span></div>` : ''}
        `;
        reviewList.appendChild(item);
    });

    const percentage = Math.round((score / questions.length) * 100);
    document.getElementById('score-text').textContent = `${score} / ${questions.length}`;
    document.getElementById('percentage-text').textContent = `Úspešnosť: ${percentage}%`;

    const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
    const secs = String(secondsElapsed % 60).padStart(2, '0');
    document.getElementById('time-spent-text').textContent = `Celkový čas: ${mins}:${secs}`;
}

function restartQuiz() {
    userAnswers = new Array(questions.length).fill(null);
    currentIndex = 0;
    document.getElementById('results-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');
    startTimer();
    loadQuestion(0);
}

function confirmReset() {
    if (confirm("Chcete reštartovať test a vrátiť sa na začiatok?")) {
        restartQuiz();
    }
}

// Inicializácia pri načítaní
startTimer();
loadQuestion(0);
</script>
