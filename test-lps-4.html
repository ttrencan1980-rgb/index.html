<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>   Test LPS 4   </title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .quiz-container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 750px;
            padding: 25px;
            position: relative;
        }
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eef0f3;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .home-btn {
            background-color: #e4e6eb;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }
        .home-btn:hover {
            background-color: #d8dadf;
        }
        .timer-badge {
            background-color: #e7f3ff;
            color: #1877f2;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95rem;
        }
        .progress-text {
            font-size: 0.9rem;
            color: #65676b;
            font-weight: 600;
        }
        .question-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #050505;
            margin-bottom: 5px;
            line-height: 1.4;
        }
        .norm-title {
            font-size: 0.85rem;
            color: #65676b;
            margin-bottom: 20px;
            font-style: italic;
        }
        .options-list {
            list-style: none;
            padding: 0;
            margin: 0 0 25px 0;
        }
        .option-item {
            border: 2px solid #e4e6eb;
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: flex-start;
            line-height: 1.4;
            font-size: 1rem;
        }
        .option-item:hover:not(.disabled) {
            background-color: #f7f8fa;
            border-color: #bcc0c4;
        }
        .option-letter {
            font-weight: bold;
            margin-right: 12px;
            min-width: 25px;
        }
        
        /* Stavy po kliknutí na odpoveď */
        .option-item.correct {
            background-color: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724 !important;
            font-weight: 600;
        }
        .option-item.incorrect {
            background-color: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24 !important;
        }
        .option-item.disabled {
            cursor: default;
        }

        /* Navigačné tlačidlá */
        .quiz-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid #eef0f3;
            padding-top: 20px;
        }
        .nav-btn {
            background-color: #1877f2;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .nav-btn:hover {
            background-color: #166fe5;
        }
        .nav-btn:disabled {
            background-color: #e4e6eb;
            color: #bcc0c4;
            cursor: not-allowed;
        }
        .secondary-btn {
            background-color: #e4e6eb;
            color: #050505;
        }
        .secondary-btn:hover:not(:disabled) {
            background-color: #d8dadf;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-left">
            <button class="btn-back" onclick="goBack()">&#8592; Domov</button>
            <h1>Test TSLPS1</h1>
        </div>
        <div class="timer" id="timer">00:00</div>
    </header>

    <div id="quizBody">
        <div class="question-title" id="questionTitle">Názov otázky...</div>
        <div class="norm-title" id="normTitle">Norma...</div>

        <ul class="options-list" id="optionsList">
            <!-- Možnosti sa načítajú dynamicky -->
        </ul>
    </div>

    <div class="quiz-footer">
        <button class="nav-btn secondary-btn" id="prevBtn">← Predchádzajúca</button>
        <button class="nav-btn" id="nextBtn">Nasledujúca →</button>
    </div>
</div>

<script>
    // Úplná databáza 29 otázok z priložených obrázkov
    const quizData = [

                "uvedenie informácii pomocou výkresov, kde sú vyznačené vzťahy medzi dvoma a viac premennými veličinami a operáciami"
            ],

        {

            norm: "STN 33 2000-1:2009",
            options: [
                "elektrická striedavá sieť s uzemneným bodom zdroja. Jeden bod priamo uzemnený pri zdroji neživé časti el. spotrebičov sú spojené s uzemňovačmi elektricky nezávislými od uzemňovacej siete",
                "elektrická striedavá sieť s uzemneným bodom zdroja. Má iba jeden bod priamo uzemnený pri zdroji, neživé časti inštalácie sú spojené s týmto bodom prostredníctvom ochranných vodičov",
                "elektrická striedavá sieť s uzemneným bodom zdroja. Jeden bod priamo uzemnený pri zdroji neživé časti el. spotrebičov sú spojené so samostatnými uzemňovačmi nezávislými od zdroja"
            ],

        },
        {
            q: "Vodorovné vrchné plochy zábran alebo krytov, ktoré sú ľahko prístupné, musia poskytovať stupeň ochrany aspoň",
            norm: "STN 33 2000-4-41:2019",
            options: ["IP2X", "IP3X", "IP4X"],
            correct: 2 // C
        },
        {
            q: "Zariadenie s impulzným výdržným napätím zodpovedajúcim kategórii prepätia IV je zariadenie",
            norm: "STN 33 2000-4-443:2017",
            options: [
                "vhodné na použitie v napájacom bode elektrických inštalácií alebo v jeho blízkosti, napríklad pred hlavným domovom rozvádzačom",
                "vhodné na pripojenie na pevné elektrické inštalácie zabezpečujúce normálny stupeň pohotovosti zvyčajne vyžadovaný pre elektrické spotrebiče",
                "určené na použitie v pevných elektrických inštaláciách v hlavnom domovom rozvádzači a za ním, s vysokým stupňom pohotovosti"
            ],

        {

        },
        {

            norm: "STN EN 62305-1:2012",
            options: [
                "Zóna ochrany pred bleskom",
                "Elektromagnetický impulz vyvolaný bleskom",
                "Úroveň ochrany pred bleskom"
            ],
            correct: 1 // B
        },
        {
            q: "Ako je charakterizovaná chránená stavba v zmysle STN EN 62305",
            norm: "STN EN 62305-1:2012",
            options: [
                "Je to stavba alebo inžinierska sieť, pre ktorú sa vyžaduje ochrana pred účinkami blesku",
                "Je to inžinierska sieť, pre ktorú sa vyžaduje ochrana pred účinkami blesku",
                "Je to stavba , pre ktorú sa vyžaduje ochrana pred účinkami blesku"
            ],
            correct: 2 // C
        },
        {
            q: "Normy rady STN EN 62305 využívajú v celom rozsahu skrátené názvy. Čo znamená označenie LPS",
            norm: "STN EN 62305-1:2012",
            options: [
                "Systém ochrany pred bleskom",
                "Úroveň ochrany pred bleskom",
                "Zóna ochrany pred bleskom"
            ],
            correct: 0 // A
        },
        {
            q: "Aký je polomer valivej gule r v závislosti na triede LPS I",
            norm: "STN EN 62305-1:2012",
            options: ["20 m", "45 m", "30 m"],
            correct: 0 // A
        },
        {
            q: "Ako je definované riziko R a čo táto hodnota predstavuje",
            norm: "STN EN 62305-2:2013",
            options: [
                "Pravdepodobné priemerné straty po dobu životnosti",
                "Pravdepodobné priemerné ročné straty",
                "Pravdepodobné priemerné straty za 100 rokov"
            ],
            correct: 1 // B
        },
        {
            q: "Čo je považované podľa návrhu ochrany pred bleskom za nebezpečnú udalosť",
            norm: "STN EN 62305-2:2013",
            options: [
                "zásah blesku do chránenej stavby alebo v jej blízkosti, do alebo v blízkosti vedenia pripojeného k chránenej stavbe, ktorý nemôže spôsobiť škodu",
                "zásah blesku do chránenej stavby alebo v jej blízkosti, do alebo v blízkosti vedenia pripojeného k chránenej stavbe, ktorý môže spôsobiť škodu",
                "zásah blesku do chránenej stavby alebo v jej blízkosti, ktorý nemôže spôsobiť škodu"
            ],
            correct: 1 // B
        },
        {
            q: "Ako sú označované základné typy škôd pri výpočtoch",
            norm: "STN EN 62305-2:2013",
            options: [
                "D1 ľudské životy , D2 verejné služby , D3 porucha elektrických a elektronických systémov",
                "D1 ľudské životy , D2 verejné služby , D3 kultúrne dedičstvo , D4 ekonomické",
                "D1 úraz živých bytostí , D2 hmotná škoda , D3 porucha elektrických a elektronických systémov"
            ],
            correct: 2 // C
        },
        {
            q: "Aké základné typy strát rozoznávame na chránenom objekte",
            norm: "STN EN 62305-2:2013",
            options: [
                "L1 strata ľudských životov , L2 strata služby pre verejnosť , L3 strata kultúrneho dedičstva , L4 strata ekonomickej hodnoty",
                "L1 úraz živých bytostí , L2 hmotná škoda , L3 porucha elektrických a elektronických systémov",
                "L1 strata ľudských životov , L2 strata služby pre verejnosť , L3 strata kultúrneho dedičstva , L4 strata elektrických a elektronických systémov"
            ],
            correct: 0 // A
        },
        {
            q: "Aké postupy je nutné použiť pri spracovaní projektovej dokumentácii LPS a k jej následnej kontrole pri revízii",
            norm: "STN EN 62305-3:2012",
            options: [
                "určenie doby trvania blesku",
                "vyhodnotenie rizika a stanovenie potrebnej úrovne ochrany",
                "stanovenie kompetencií pri montáži"
            ],
            correct: 1 // B
        },
        {
            q: "Pre aké prípady je vhodný návrh umiestnenia zachytávacej sústavy metódou mriežkovej sústavy",
            norm: "STN EN 62305-3:2012",
            options: [
                "pre všetky",
                "pre jednoduché tvary budov obmedzených výškou budovy určených triedou LPS",
                "pre rovinné plochy"
            ],
            correct: 2 // C
        },
        {
            q: "Koľko zvodov je nutné inštalovať u neizolovaného (neoddialeného) LPS triedy III",
            norm: "STN EN 62305-3:2012",
            options: ["na každých 20m", "na každých 10m", "na každých 15m"],
            correct: 2 // C
        },
        {
            q: "Aký smie byť najmenší celkový počet zemničov (usporiadaných z vodorovných alebo zvislých zemničov) v usporiadaní typu A inštalovaného mimo chránenej stavby",
            norm: "STN EN 62305-3:2012",
            options: ["3", "1", "2"],
            correct: 2 // C
        },
        {
            q: "Kde je nutné inštalovať prepäťové ochranné opatrenia (SPD pre ekvipotenciálne pospájanie)",
            norm: "STN EN 62305-4:2013",
            options: [
                "na vstupe aj výstupe vedení každej LPZ",
                "na vstupe vedení do každej LPZ",
                "na výstupe vedení z každej LPZ"
            ],
            correct: 1 // B
        },
        {
            q: "Revízni technik musí pripraviť revíznu správu, ktorá bude pripojená k technickej dokumentácii a k predchádzajúcim revíznym správam. Aké informácie musí správa o revízii obsahovať",
            norm: "STN EN 62305-4:2013",
            options: [
                "o manažérstve rizika",
                "o všeobecnom stave SPM, akejkoľvek odchýlke, výsledkoch meraní",
                "o vizuálnom stave systému ochrany pred bleskom bez výsledkov merania"
            ],
            correct: 1 // B
        },
        {
            q: "Čo zahrňuje systém tienenia vonkajších vedení vstupujúcich do stavby",
            norm: "STN EN 62305-4:2013",
            options: [
                "tienenie káblov a uzemňovaciu sústavu",
                "tienenie káblov, uzavretých kovových káblových kanálov a betónových káblových kanálov so vzájomne pospájaným armovaním",
                "tienenie káblov , uzavretých kovových káblových kanálov a betónových káblových kanálov bez vzájomného pospájaného armovania"
            ],
            correct: 1 // B
        },

            norm: "STN EN 62305-4:2013",
            options: ["50 mm²", "100 mm²", "25 mm²"],
            correct: 0 // A
        },
        {

            norm: "STN EN 62305-3:2012",
            options: ["na úrovni terénu", "do 1m nad úrovňou terénu", "1m nad úrovňou terénu"],
            correct: 0 // A
        },
        {
            q: "Ako je u zariadení s nebezpečenstvom výbuchu definované riziko R a čo táto hodnota predstavuje",
            norm: "STN EN 62305-2:2013",
            options: [
                "Pravdepodobné priemerné straty za 100 rokov",
                "Pravdepodobné priemerné straty po dobu životnosti",
                "Pravdepodobné priemerné ročné straty"
            ],
            correct: 2 // C
        },
        {
            q: "Samostadne stojaca nádrž alebo kontajnery by mali byť uzemnené. Koľko uzemnení vyžaduje nádrž s vodorovným rozmerom (priemer alebo dĺžka) 28m",
            norm: "STN EN 62305-3:2012",
            options: ["3", "1", "2"],
            correct: 2 // C
        },
        {
            q: "Je pre stanovenie umiestnenia zachytávacej sústavy u stavieb s nebezpečenstvom výbuchu vhodná metóda valivej guli",
            norm: "STN EN 62305-3:2012",
            options: ["áno", "áno s metódou oddialeného LPS", "nie"],
            correct: 0 // A
        }
    ];

    let currentIndex = 0;
    let userAnswers = new Array(quizData.length).fill(null); // Uchováva zvolené odpovede
    let timerInterval = null;
    let totalSeconds = 0;

    // Prvky DOM
    const questionTitle = document.getElementById("questionTitle");
    const normTitle = document.getElementById("normTitle");
    const optionsList = document.getElementById("optionsList");
    const progressText = document.getElementById("progressText");
    const timeDisplay = document.getElementById("timeDisplay");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const homeBtn = document.getElementById("homeBtn");

    // Štart časovača
    function startTimer() {
        clearInterval(timerInterval);
        totalSeconds = 0;
        timerInterval = setInterval(() => {
            totalSeconds++;
            const mins = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
            const secs = String(totalSeconds % 60).padStart(2, '0');
            timeDisplay.textContent = `${mins}:${secs}`;
        }, 1000);
    }

    // Načítanie otázky
    function loadQuestion(index) {
        const item = quizData[index];
        questionTitle.textContent = `${index + 1}. ${item.q}`;
        normTitle.textContent = item.norm;
        progressText.textContent = `Otázka ${index + 1} z ${quizData.length}`;

        optionsList.innerHTML = "";
        const letters = ["A)", "B)", "C)"];

        const answered = userAnswers[index] !== null;

        item.options.forEach((optText, optIdx) => {
            const li = document.createElement("li");
            li.className = "option-item";
            
            if (answered) {
                li.classList.add("disabled");
                if (optIdx === item.correct) {
                    li.classList.add("correct");
                }
                if (userAnswers[index] === optIdx && optIdx !== item.correct) {
                    li.classList.add("incorrect");
                }
            } else {
                li.onclick = () => selectOption(optIdx);
            }

            li.innerHTML = `<span class="option-letter">${letters[optIdx]}</span> <span>${optText}</span>`;
            optionsList.appendChild(li);
        });

        // Aktualizácia tlačidiel
        prevBtn.disabled = index === 0;
        if (index === quizData.length - 1) {
            nextBtn.textContent = "Dokončiť";
        } else {
            nextBtn.textContent = "Nasledujúca →";
        }
    }

    // Vyber odpovede
    function selectOption(selectedIndex) {
        if (userAnswers[currentIndex] !== null) return; // Zabráni opätovnému kliknutiu

        userAnswers[currentIndex] = selectedIndex;
        loadQuestion(currentIndex); // Znovu načíta pre zobrazenie farieb
    }

    // Navigácia
    prevBtn.onclick = () => {
        if (currentIndex > 0) {
            currentIndex--;
            loadQuestion(currentIndex);
        }
    };

    nextBtn.onclick = () => {
        if (currentIndex < quizData.length - 1) {
            currentIndex++;
            loadQuestion(currentIndex);
        } else {
            alert(`Test je dokončený!\nVáš čas: ${timeDisplay.textContent}`);
        }
    };

    // Domov / Reset
    homeBtn.onclick = () => {
        if (confirm("Chcete sa vrátiť na domovskú stránku a spustiť test odznova?")) {
            currentIndex = 0;
            userAnswers.fill(null);
            startTimer();
            loadQuestion(currentIndex);
        }
    };

    // Inicializácia testu pri načítaní
    startTimer();
    loadQuestion(currentIndex);
</script>

</body>
</html>
