            color: #fff !important;

        },
        {
            q: "Pravidelná revízia elektrických spotrebičov okrem spotrebičov držaných v ruke zaradených do skupiny E podľa oblasti ich používania sa vykonáva",
            norm: "STN 33 1630:2025",
            options: [
                "1 x za 24 mesiacov",
                "1 x za 12 mesiacov",
                "1 x za 6 mesiacov"
            ],
            correct: 0
        },
        {
            q: "Maximálna hodnota prúdu v ochrannom vodiči pre zariadenia, ktoré nie sú trvalo pripojené k napájacej sieti je",
            norm: "STN EN 50699:2022",
            options: [
                "vo všeobecnosti 3,5 mA",
                "vo všeobecnosti 5 mA",
                "vo všeobecnosti 10 mA"
            ],
            correct: 0
        },
        {
            q: "Aké sú minimálne intervaly medzi revíziami LPS hladiny I a II",
            norm: "STN EN 62305-3:2012",
            options: [
                "4 roky",
                "2 roky",
                "3 roky"
            ],
            correct: 1
        },
        {
            q: "Na základe akých údajov sa rozhoduje o ochrane stavby alebo inžinierskych sieťach pred bleskom, rovnako ako o výber ochranných opatrení",
            norm: "STN EN 62305-1:2012",
            options: [
                "vzdialenosť objektu od okolitých stavieb",
                "hodnoty investície",
                "strata alebo úraz ľudského života, strata služieb pre verejnosť, strata kultúrneho dedičstva"
            ],
            correct: 2
        }
    ];

    let currentQuestionIndex = 0;
    let userAnswers = new Array(questions.length).fill(null);
    let secondsElapsed = 0;
    let timerInterval = null;

    // Časovač
    function startTimer() {
        timerInterval = setInterval(() => {
            secondsElapsed++;
            const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
            const secs = String(secondsElapsed % 60).padStart(2, '0');
            document.getElementById('timer').innerText = `${mins}:${secs}`;
        }, 1000);
    }

    // Načítanie otázky
    function loadQuestion() {
        const qData = questions[currentQuestionIndex];
        document.getElementById('q-number').innerText = `Otázka ${currentQuestionIndex + 1} z ${questions.length}`;
        document.getElementById('q-text').innerText = `${currentQuestionIndex + 1}. ${qData.q}`;
        document.getElementById('q-norm').innerText = qData.norm;

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        const letters = ['A', 'B', 'C'];

        qData.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = `${letters[index]}) ${opt}`;
            btn.onclick = () => selectOption(index);

            // Ak už bola otázka zodpovedaná
            if (userAnswers[currentQuestionIndex] !== null) {
                btn.disabled = true;
                const selected = userAnswers[currentQuestionIndex];
                
                if (index === qData.correct) {
                    btn.classList.add('correct');
                }
                if (selected === index && selected !== qData.correct) {
                    btn.classList.add('incorrect');
                }
            }

            optionsContainer.appendChild(btn);
        });

        // Tlačidlo Späť
        document.getElementById('prev-btn').disabled = currentQuestionIndex === 0;

        // Tlačidlo Ďalšia / Dokončiť
        const nextBtn = document.getElementById('next-btn');
        if (currentQuestionIndex === questions.length - 1) {
            nextBtn.innerText = 'Dokončiť';
        } else {
            nextBtn.innerText = 'Ďalšia';
        }
    }

    // Výber odpovede
    function selectOption(index) {
        userAnswers[currentQuestionIndex] = index;
        loadQuestion();
    }

    // Navigáciavpored / dokončenie
    function nextQuestion() {
        if (currentQuestionIndex < questions.length - 1) {
            currentQuestionIndex++;
            loadQuestion();
        } else {
            finishQuiz();
        }
    }

    // Navigácia späť
    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            loadQuestion();
        }
    }

    // Tlačidlo Domov
    function goHome() {
        if (confirm("Chceš sa vrátiť domov? Tvoj progres v teste sa stratí.")) {
            window.location.reload();
        }
    }

    // Vyhodnotenie
    function finishQuiz() {
        clearInterval(timerInterval);
        let score = 0;
        questions.forEach((q, i) => {
            if (userAnswers[i] === q.correct) {
                score++;
            }
        });

        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');

        const container = document.getElementById('quiz-container');
        container.innerHTML = `
            <div class="summary">
                <h2>Test bol dokončený!</h2>
                <p>Tvoje skóre: <strong>${score} z ${questions.length}</strong> (${Math.round((score/questions.length)*100)}%)</p>
                <p>Celkový čas: <strong>${mins}:${secs}</strong></p>
                <button class="restart-btn" onclick="window.location.reload()">Spracovať test znova</button>
            </div>
        `;
    }

    // Štart pri načítaní
    window.onload = () => {
        startTimer();
        loadQuestion();
    };
</script>
</body>
</html>
