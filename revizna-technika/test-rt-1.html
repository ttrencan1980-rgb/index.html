    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    .option-btn {
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    
    .option-btn.correct-filled {
      background-color: #72f883 !important;
      border-color: #72f883 !important;
      color: #000 !important;
    }
    .option-btn.correct-outline {
      background-color: #ffffff !important;
      border: 2px solid #38ef7d !important;
      color: #000 !important;
    }
    .option-btn.incorrect-filled {
      background-color: #f85959 !important;
      border-color: #f85959 !important;
      color: #ffffff !important;
    }

    .nav-buttons {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }
    .btn {
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }
    .btn-prev {
      background: #ffffff;
      border: 1px solid #cbd5e0;
      color: #4a5568;
    }
    .btn-next {
      background: #2563eb;
      color: #ffffff;
    }
    .btn-result {
      background: #ffffff;
      border: 1px solid #cbd5e0;
      color: #2563eb;
      margin-left: auto;
    }
    .hidden {

      text-align: center;
      padding: 20px;

      font-size: 24px;
      margin-bottom: 10px;

    .score-percent {

      color: #2563eb;

    {
      title: "Na základe akých údajov sa rozhoduje o ochrane stavby alebo inžinierskych sieťí pred bleskom, rovnako ako o výber ochranných opatrení",
      norm: "STN EN 62305-1:2012",
      options: [
        "A) strata alebo úraz ľudského života, strata služieb pre verejnosť, strata kultúrneho dedičstva",
        "B) hodnoty investície",
        "C) vzdialenosť objektu od okolitých stavieb"
      ],
      correctIndex: 0,
      styleType: "outline"
    }
  ];

  let currentIdx = 0;
  let userAnswers = new Array(questions.length).fill(null);

  function renderQuestion() {
    const q = questions[currentIdx];
    document.getElementById('progress-text').innerText = `Otázka: ${currentIdx + 1} / ${questions.length}`;
    document.getElementById('question-text').innerText = q.title;
    document.getElementById('norm-text').innerText = q.norm;

    document.getElementById('prev-btn').style.visibility = currentIdx === 0 ? 'hidden' : 'visible';

    const container = document.getElementById('options-container');
    container.innerHTML = '';

    const answered = userAnswers[currentIdx] !== null;

    q.options.forEach((optText, optIdx) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = optText;

      if (answered) {
        btn.disabled = true;
        const selectedOpt = userAnswers[currentIdx];

        if (optIdx === q.correctIndex) {
          if (q.styleType === 'filled') {
            btn.classList.add('correct-filled');
          } else {
            btn.classList.add('correct-outline');
          }
        } else if (optIdx === selectedOpt) {
          btn.classList.add('incorrect-filled');
        }
      } else {
        btn.onclick = () => selectOption(optIdx);
      }

      container.appendChild(btn);
    });

    updateAccuracy();
  }

  function selectOption(optIdx) {
    userAnswers[currentIdx] = optIdx;
    renderQuestion();
  }

  function nextQuestion() {
    if (currentIdx < questions.length - 1) {
      currentIdx++;
      renderQuestion();
    } else {
      showResults();
    }
  }

  function prevQuestion() {
    if (currentIdx > 0) {
      currentIdx--;
      renderQuestion();
    }
  }

  function updateAccuracy() {
    let answeredCount = 0;
    let correctCount = 0;

    userAnswers.forEach((ans, idx) => {
      if (ans !== null) {
        answeredCount++;
        if (ans === questions[idx].correctIndex) {
          correctCount++;
        }
      }
    });

    const percent = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
    document.getElementById('accuracy-text').innerText = `Úspešnosť: ${percent}%`;
  }

  function showResults() {
    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.remove('hidden');

    let correctCount = 0;
    userAnswers.forEach((ans, idx) => {
      if (ans === questions[idx].correctIndex) {
        correctCount++;
      }
    });

    const totalPercent = Math.round((correctCount / questions.length) * 100);
    document.getElementById('final-percent').innerText = `${totalPercent}%`;
    document.getElementById('final-stats-text').innerText = `Správne zodpovedaných ${correctCount} z ${questions.length} otázok.`;
  }

  function restartQuiz() {
    currentIdx = 0;
    userAnswers = new Array(questions.length).fill(null);
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');
    renderQuestion();
  }

  renderQuestion();
</script>

</body>
</html>
