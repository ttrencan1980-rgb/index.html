   
    <!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revízne Testy</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f5f7fa;
      margin: 0;
      padding: 20px;
      color: #333;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 650px;
    }
    .category-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    .category-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      border-bottom: 2px solid #edf2f7;
      padding-bottom: 10px;
    }
    .badge-cat {
      background-color: #2563eb;
      color: white;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 14px;
    }
    .badge-cat.cat-rt {
      background-color: #1e40af;
    }
    .category-title {
      font-size: 20px;
      margin: 0;
      color: #1a202c;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }
    .test-btn {
      display: block;
      padding: 12px;
      background-color: #2563eb;
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      transition: background-color 0.2s ease;
    }
    .test-btn:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- 1. KATEGÓRIA: REVÍZNY TECHNIK (RT) -->
  <div class="category-card">
      <div class="category-header">
          <span class="badge-cat cat-rt">§ 24</span>
          <h2 class="category-title">Revízny Technik (RT)</h2>
      </div>
      <div class="grid" id="list-rt"></div>
  </div>

</div>

<script>
  // Zoznam testov pre kategóriu Revízny Technik
  const rtTests = [
    { name: "Test RT-1", file: "test-rt-1.html" },
    { name: "Test RT-2", file: "test-rt-2.html" },
    { name: "Test RT-3", file: "test-rt-3.html" },
    { name: "Test RT-4", file: "test-rt-4.html" },
    { name: "Test RT-5", file: "test-rt-5.html" },
    { name: "Test RT-6", file: "test-rt-6.html" },
    { name: "Test RT-7", file: "test-rt-7.html" },
    { name: "Test RT-8", file: "test-rt-8.html" },
    { name: "Test RT-9", file: "test-rt-9.html" },
    { name: "Test RT-10", file: "test-rt-10.html" },
    { name: "Test RT-11", file: "test-rt-11.html" },
    { name: "Test RT-12", file: "test-rt-12.html" }
  ];

  // Názov podzložky na GitHube
  const folderPath = "revizna-technika";

  // Funkcia, ktorá vygeneruje tlačidlá pod sebou/v mriežke
  const container = document.getElementById("list-rt");
  
  rtTests.forEach(test => {
    const btn = document.createElement("a");
    btn.className = "test-btn";
    btn.innerText = test.name;
    // Vytvorí cestu: revizna-technika/test-rt-1.html
    btn.href = `${folderPath}/${test.file}`; 
    container.appendChild(btn);
  });
</script>

</body>
</html>
