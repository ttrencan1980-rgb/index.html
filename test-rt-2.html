<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Test RT2 - Revízny technik</title>
  <style>
    :root {
      --primary-color: #0056b3;
      --primary-hover: #003d80;
      --secondary-color: #6c757d;
      --secondary-hover: #5a6268;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #333333;
      --correct-color: #28a745;
      --incorrect-color: #dc3545;
      --border-radius: 12px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 12px;
      line-height: 1.5;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 16px;
      border-radius: var(--border-radius);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .nav-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid #eee;
      padding-bottom: 12px;
    }

    h1 {
      font-size: 1.25rem;
      margin: 0;
      color: var(--primary-color);
      text-align: center;
      width: 100%;
      order: -1;
    }

    .btn-nav {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: var(--border-radius);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      flex: 1;
      text-align: center;
    }

    .btn-nav:hover, .btn-nav:active {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: var(--secondary-color);
    }

    .btn-secondary:hover, .btn-secondary:active {
      background-color: var(--secondary-hover);
    }

    #quiz-container {
      display: block;
      min-height: 100px;
    }

    .question-card {
      margin-bottom: 20px;
      padding: 16px;
      border: 1px solid #e0e0e0;
      border-radius: var(--border-radius);
      background-color: #fafafa;
      display: block;
    }

    .question-title {
      font-weight: 600;
      margin-bottom: 14px;
      font-size: 1rem;
      color: #111;
    }

    .options-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background-color: white;
      cursor: pointer;
      font-size: 0.95rem;
      line-height: 1.4;
      transition: background-color 0.2s, border-color 0.2s;
      min-height: 48px;
    }

    .option-btn:hover:not(:disabled) {
      background-color: #eef5ff;
      border-color: var(--primary-color);
    }

    .option-btn.correct {
      background-color: #d4edda !important;
      border-color: var(--correct-color) !important;
      color: #155724;
      font-weight: 600;
    }

    .option-btn.incorrect {
      background-color: #f8d7da !important;
      border-color: var(--incorrect-color) !important;
      color: #721c24;
    }

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }

    .result-section {
      display: none;
      text-align: center;
      padding: 20px;
      background: #e9ecef;
      border-radius: var(--border-radius);
      margin-top: 20px;
    }

    .result-score {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--primary-color);
      margin: 10px 0;
    }

    @media (min-width: 600px) {
      body {
        padding: 20px;
      }
      .container {
        padding: 25px;
      }
      h1 {
        width: auto;
        order: 0;
        font-size: 1.5rem;
      }
      .btn-nav {
        flex: initial;
      }
      .action-buttons {
        flex-direction: row;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="nav-bar">
    <a href="#" onclick="history.back(); return false;" class="btn-nav">&larr; Späť</a>
    <h1>Test RT2 (40 otázok)</h1>
    <a href="/revizny-technik" class="btn-nav">Revízny technik</a>
  </div>

  <div id="quiz-container"></div>

  <div class="action-buttons">
    <button id="finish-btn" class="btn-nav" onclick="evaluateQuiz()">Vyhodnotiť test</button>
    <button id="later-btn" class="btn-nav btn-secondary" onclick="tryLater()">Vyskúšať neskôr</button>
  </div>

  <div id="result-section" class="result-section">
    <h2>Výsledok testu</h2>
    <p class="result-score" id="score-text"></p>
    <p id="percentage-text"></p>
    <button class="btn-nav" onclick="resetQuiz()">Opakovať test</button>
  </div>
</div>

  let userAnswers = {};

  function renderQuiz() {
    const container = document.getElementById('quiz-container');
    if (!container) return;
    
    container.innerHTML = '';

    testQuestions.forEach((q, index) => {
      const qCard = document.createElement('div');
      qCard.className = 'question-card';

      const qTitle = document.createElement('div');
      qTitle.className = 'question-title';
      qTitle.innerText = q.question;
      qCard.appendChild(qTitle);

      const optionsList = document.createElement('ul');
      optionsList.className = 'options-list';

      q.options.forEach((opt, optIndex) => {
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `option-btn opt-${index}-${optIndex}`;
        btn.innerText = opt;
        btn.onclick = () => selectOption(index, optIndex);
        li.appendChild(btn);
        optionsList.appendChild(li);
      });

      qCard.appendChild(optionsList);
      container.appendChild(qCard);
    });
  }

  function selectOption(qIndex, optIndex) {
    userAnswers[qIndex] = optIndex;
    const qData = testQuestions[qIndex];

    qData.options.forEach((_, idx) => {
      const btn = document.querySelector(`.opt-${qIndex}-${idx}`);
      if (btn) {
        btn.classList.remove('correct', 'incorrect');
        
        if (idx === optIndex) {
          if (optIndex === qData.correctIndex) {
            btn.classList.add('correct');
          } else {
            btn.classList.add('incorrect');
          }
        }
        
        if (idx === qData.correctIndex && optIndex !== qData.correctIndex) {
          btn.classList.add('correct');
        }
      }
    });
  }

  function evaluateQuiz() {
    let score = 0;
    testQuestions.forEach((q, index) => {
      if (userAnswers[index] === q.correctIndex) {
        score++;
      }
    });

    const percentage = Math.round((score / testQuestions.length) * 100);
    
    document.getElementById('score-text').innerText = `${score} / ${testQuestions.length}`;
    document.getElementById('percentage-text').innerText = `Úspešnosť: ${percentage}%`;
    document.getElementById('result-section').style.display = 'block';
    
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }

  function resetQuiz() {
    userAnswers = {};
    document.getElementById('result-section').style.display = 'none';
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function tryLater() {
    resetQuiz();
    if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = '/revizny-technik';
    }
  }

  // Poistka pre spustenie načítania v rôznych stavoch prehliadača
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', renderQuiz);
  } else {
    renderQuiz();
  }
  
  window.onload = function() {
    if (document.getElementById('quiz-container').children.length === 0) {
      renderQuiz();
    }
  };
</script>

</body>
</html>
