<head>

    :root {

      --card-bg: #ffffff;
      --text-color: #1f2937;
      --subtext-color: #6b7280;
      --correct-bg: #dcfce7;
      --correct-border: #22c55e;
      --correct-text: #15803d;
      --incorrect-bg: #fee2e2;
      --incorrect-border: #ef4444;
      --incorrect-text: #b91c1c;
      --border-color: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .quiz-container {
      background-color: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 800px;
      padding: 30px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--bg-color);
    }

    .title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
    }

    .progress {
      font-weight: 600;
      color: var(--subtext-color);
    }

    .question-title {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .question-norm {
      font-size: 0.9rem;
      color: var(--subtext-color);
      margin-bottom: 24px;
      font-weight: 500;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 30px;
    }

    .option-btn {
      background-color: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: 16px 20px;
      text-align: left;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      line-height: 1.4;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background-color: #eff6ff;
    }

    .option-btn .prefix {
      font-weight: 700;
      min-width: 24px;
    }

    .option-btn.correct {
      background-color: var(--correct-bg);
      border-color: var(--correct-border);
      color: var(--correct-text);
      font-weight: 600;
    }

    .option-btn.incorrect {
      background-color: var(--incorrect-bg);
      border-color: var(--incorrect-border);
      color: var(--incorrect-text);
      font-weight: 600;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-secondary {
      background-color: #ffffff;
      color: var(--text-color);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: #f9fafb;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .results-container {
      display: none;
      text-align: center;
    }

    .results-score {
      font-size: 3rem;
      font-weight: 800;
      color: var(--primary);
      margin: 20px 0;
    }

    .results-summary {
      font-size: 1.1rem;
      margin-bottom: 30px;
      color: var(--subtext-color);
    }

    .review-list {
      text-align: left;
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .review-item {
      padding: 16px;
      border-radius: 8px;
      background-color: #f9fafb;
      border-left: 4px solid var(--border-color);
    }

    .review-item.correct {
      border-left-color: var(--correct-border);
    }

    .review-item.incorrect {
      border-left-color: var(--incorrect-border);
    }

    .review-q {
      font-weight: 600;
      margin-bottom: 8px;
    }

    .review-norm {
      font-size: 0.85rem;
      color: var(--subtext-color);
      margin-bottom: 8px;
    }

    .review-ans {
      font-size: 0.95rem;
    }

    @media (max-width: 600px) {
      .quiz-container {
        padding: 20px;
      }
      .controls {
        flex-direction: column;
      }
      .btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>

      options: [

  let currentQuestionIndex = 0;
  let userAnswers = new Array(questions.length).fill(null);

  const questionTextEl = document.getElementById("question-text");
  const normTextEl = document.getElementById("norm-text");
  const optionsContainerEl = document.getElementById("options-container");
  const progressTextEl = document.getElementById("progress-text");
  const prevBtn = document.getElementById("prev-btn");
  const nextBtn = document.getElementById("next-btn");

  function loadQuestion() {
    const qData = questions[currentQuestionIndex];
    questionTextEl.textContent = `${currentQuestionIndex + 1}. ${qData.q}`;
    normTextEl.textContent = qData.norm;
    progressTextEl.textContent = `Otázka ${currentQuestionIndex + 1} z ${questions.length}`;

    optionsContainerEl.innerHTML = "";

    const prefixes = ["A)", "B)", "C)", "D)"];
    const hasAnswered = userAnswers[currentQuestionIndex] !== null;

    qData.options.forEach((opt, index) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      
      if (hasAnswered) {
        btn.disabled = true;
        const selected = userAnswers[currentQuestionIndex];
        if (index === qData.correct) {
          btn.classList.add("correct");
        }
        if (selected === index && selected !== qData.correct) {
          btn.classList.add("incorrect");
        }
      }

      btn.innerHTML = `<span class="prefix">${prefixes[index]}</span> <span>${opt}</span>`;
      btn.onclick = () => selectOption(index);
      optionsContainerEl.appendChild(btn);
    });

    prevBtn.disabled = currentQuestionIndex === 0;
    
    if (currentQuestionIndex === questions.length - 1) {
      nextBtn.textContent = "Dokončiť test";
    } else {
      nextBtn.textContent = "Nasledujúca >";
    }
  }

  function selectOption(optionIndex) {
    if (userAnswers[currentQuestionIndex] !== null) return;
    
    userAnswers[currentQuestionIndex] = optionIndex;
    loadQuestion();
  }

  function nextQuestion() {
    if (currentQuestionIndex < questions.length - 1) {
      currentQuestionIndex++;
      loadQuestion();
    } else {
      showResults();
    }
  }

  function prevQuestion() {
    if (currentQuestionIndex > 0) {
      currentQuestionIndex--;
      loadQuestion();
    }
  }

  function showResults() {
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("results-screen").style.display = "block";

    let score = 0;
    const reviewListEl = document.getElementById("review-list");
    reviewListEl.innerHTML = "";

    const prefixes = ["A", "B", "C", "D"];

    questions.forEach((qData, index) => {
      const userAns = userAnswers[index];
      const isCorrect = userAns === qData.correct;
      if (isCorrect) score++;

      const reviewItem = document.createElement("div");
      reviewItem.className = `review-item ${isCorrect ? 'correct' : 'incorrect'}`;

      let userAnsText = userAns !== null ? `${prefixes[userAns]}) ${qData.options[userAns]}` : "Nezodpovedané";
      let correctAnsText = `${prefixes[qData.correct]}) ${qData.options[qData.correct]}`;

      reviewItem.innerHTML = `
        <div class="review-q">${index + 1}. ${qData.q}</div>
        <div class="review-norm">${qData.norm}</div>
        <div class="review-ans">
          <strong>Vaša odpoveď:</strong> ${userAnsText}<br>
          ${!isCorrect ? `<strong>Správna odpoveď:</strong> ${correctAnsText}` : ""}
        </div>
      `;
      reviewListEl.appendChild(reviewItem);
    });

    const percentage = Math.round((score / questions.length) * 100);
    document.getElementById("score-text").textContent = `${score} / ${questions.length}`;
    document.getElementById("summary-text").textContent = `Úspešnosť: ${percentage}%`;
  }

  function restartQuiz() {
    userAnswers = new Array(questions.length).fill(null);
    currentQuestionIndex = 0;
    document.getElementById("results-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    loadQuestion();
  }

  // Inicializácia pri načítaní stránky
  loadQuestion();
</script>
