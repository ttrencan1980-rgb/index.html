        minutes = minutes < 10 ? '0' + minutes : minutes;
        seconds = seconds < 10 ? '0' + seconds : seconds;

        timerElement.textContent = `${minutes}:${seconds}`;

        if (timeLeft <= 0) {
            clearInterval(countdown);
            alert('Čas vypršal!');
        }
        timeLeft--;
    }, 1000);

    // Načítanie otázky
    function loadQuestion() {
        const q = questions[currentQuestion];
        document.getElementById('q-number').textContent = `Otázka ${currentQuestion + 1} z ${questions.length}`;
        document.getElementById('q-text').textContent = q.text;
        document.getElementById('q-norm').textContent = q.norm;

        const container = document.getElementById('options-container');
        container.innerHTML = '';

        const labels = ['A', 'B', 'C'];
        const isAnswered = userAnswers[currentQuestion] !== null;

        q.options.forEach((opt, index) => {
            const div = document.createElement('div');
            div.className = 'option-item';
            
            if (isAnswered) {
                div.classList.add('disabled');
                if (index === q.correct) {
                    div.classList.add('correct');
                } else if (index === userAnswers[currentQuestion]) {
                    div.classList.add('incorrect');
                }
            } else {
                div.onclick = () => selectAnswer(index);
            }

            div.innerHTML = `<span class="label">${labels[index]})</span> ${opt}`;
            container.appendChild(div);
        });

        // Aktualizácia tlačidiel
        document.getElementById('prev-btn').disabled = currentQuestion === 0;
        document.getElementById('next-btn').disabled = currentQuestion === questions.length - 1;
    }

    // Výber odpovede
    function selectAnswer(selectedIndex) {
        userAnswers[currentQuestion] = selectedIndex;
        loadQuestion();
    }

    // Prepínanie otázok
    function changeQuestion(direction) {
        currentQuestion += direction;
        if (currentQuestion < 0) currentQuestion = 0;
        if (currentQuestion >= questions.length) currentQuestion = questions.length - 1;
        loadQuestion();
    }

    // Spustenie pri načítaní
    loadQuestion();
</script>

</body>
</html>
